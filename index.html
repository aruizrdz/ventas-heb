<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard de Ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0D0F14;font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{width:100%;max-width:380px;padding:20px;animation:fi .4s ease}
  @keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card{background:#13161E;border:1px solid #252A38;border-radius:16px;padding:44px 40px 40px;text-align:center}
  .icon{width:56px;height:56px;background:#1E2336;border:1px solid #252A38;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:24px}
  .title{font-family:"Bebas Neue";font-size:26px;letter-spacing:2px;color:#C9A84C;margin-bottom:6px}
  .sub{font-size:12px;color:#6B7280;margin-bottom:32px;line-height:1.6}
  .inp-wrap{position:relative;margin-bottom:16px}
  input{width:100%;background:#0D0F14;border:1px solid #252A38;border-radius:10px;padding:14px 48px 14px 18px;color:#E8EAF0;font-family:"DM Sans";font-size:15px;outline:none;transition:border-color .2s;letter-spacing:3px}
  input:focus{border-color:#C9A84C}
  input::placeholder{letter-spacing:1px;color:#3A3F52}
  .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#6B7280;font-size:16px;padding:4px}
  .eye:hover{color:#C9A84C}
  .btn{width:100%;background:#C9A84C;border:none;border-radius:10px;padding:14px;color:#000;font-family:"DM Sans";font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
  .btn:hover{background:#E8C97A}
  .err{margin-top:14px;font-size:12px;color:#E05252;opacity:0;transition:opacity .2s;min-height:18px}
  .err.show{opacity:1}
  .shake{animation:sk .35s ease}
  @keyframes sk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .att{font-size:11px;color:#3A3F52;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon">🔒</div>
    <div class="title">Dashboard de Ventas</div>
    <div class="sub">Contenido restringido.<br/>Ingresa la contraseña para continuar.</div>
    <div class="inp-wrap">
      <input type="password" id="p" placeholder="Contraseña" onkeydown="if(event.key==='Enter')go()"/>
      <button class="eye" onclick="toggleEye()" id="e">👁</button>
    </div>
    <button class="btn" onclick="go()">Ingresar</button>
    <div class="err" id="err">Contraseña incorrecta. Intenta de nuevo.</div>
    <div class="att" id="att"></div>
  </div>
</div>
<script>
const H="660512aa6e824f79584f525fdd5435953df65dc3d1704e83f951055207f1b932";let n=0;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function go(){
  const v=document.getElementById('p').value;if(!v)return;
  if(await sha(v)===H){const h=atob(B);document.open();document.write(h);document.close();return;}
  n++;const c=document.querySelector('.card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  document.getElementById('err').classList.add('show');document.getElementById('p').value='';
  if(n>=5){document.getElementById('p').disabled=true;document.querySelector('.btn').disabled=true;document.getElementById('err').textContent='Demasiados intentos. Recarga la página.';document.getElementById('att').textContent='';}
  else{document.getElementById('att').textContent=(5-n)+' intento'+(5-n===1?'':'s')+' restante'+(5-n===1?'':'s');}
}
function toggleEye(){const i=document.getElementById('p'),e=document.getElementById('e');i.type=i.type==='password'?'text':'password';e.textContent=i.type==='password'?'👁':'🙈';}
document.getElementById('p').focus();
